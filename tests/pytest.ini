[pytest]
# Run from the repository root: pytest tests
# (needs homeassistant and core's pytest-homeassistant of the minimum version,
# see the Testing section of custom_components/spdbf_nearby/CLAUDE.md).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = ..
# no:respx lets Home Assistant alias httpx before respx imports it.
addopts = -p no:respx
