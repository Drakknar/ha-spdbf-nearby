name: Checks

# Runs on every pull request (Dependabot's included) and on pushes to main:
# the pytest suite in tests/ on core's test harness (pytest-homeassistant), and actionlint
# on the workflows themselves.
# Its jobs are required on main. Pull requests opened by the Compatibility review
# use GITHUB_TOKEN, which doesn't trigger this workflow: close and reopen one by
# hand to run them. Release waits for this workflow on main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the test harness
        # The minimum Home Assistant (read from hacs.json, so CI follows a raise
        # there) with core's harness of the same version. The integration
        # depends on frontend and, through Assist, conversation; see the Testing
        # section of custom_components/spdbf_nearby/CLAUDE.md.
        run: |
          ha=$(jq -er .homeassistant hacs.json)
          uv venv -p 3.14 "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          VIRTUAL_ENV=$RUNNER_TEMP/venv uv pip install "homeassistant==$ha" \
            "pytest-homeassistant==$ha" \
            home-assistant-frontend hassil home-assistant-intents gazetteer-matcher

      - name: pytest
        run: python -m pytest tests

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Home Assistant core's rules (.ruff.toml) and formatting.
      - name: ruff check
        run: uvx ruff@0.17.3 check --output-format github .
      - name: ruff format
        run: uvx ruff@0.17.3 format --check .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checks Home Assistant's integration_blueprint runs on custom integrations.
      - name: hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
      - name: HACS
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
