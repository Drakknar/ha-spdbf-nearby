name: Compatibility review

# Daily check for new versions of what this repository depends on:
# Home Assistant core and the DBF server.
# Each new version is reviewed once by Claude: nothing to do opens nothing (the
# report is in the run summary), a fix comes as a pull request, anything that
# needs you as an issue, and new features worth using as an "enhancement" issue.
# What has been reviewed is kept on the watch-state branch.
on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Repeat reviews already done for the current versions (each covers the
          same range as the first time; a version only recorded as the starting
          point has nothing to compare with)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compat-review
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write # first-run baselines go to the watch-state branch
    outputs:
      run: ${{ steps.detect.outputs.run }}
      keys: ${{ steps.detect.outputs.keys }}
      subject: ${{ steps.detect.outputs.subject }}
      context: ${{ steps.detect.outputs.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find new versions
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          w() { bash .github/scripts/watch.sh "$@" </dev/null; }
          due() { [ "$FORCE" = true ] || [ "$(w should-run "$1")" = true ]; }
          ctx=$RUNNER_TEMP/watch-context.md
          : > "$ctx"
          keys=()
          subjects=()

          # Home Assistant: one review per minor release, at its newest stable
          # release. Betas are not reviewed (the owner's choice, 2026-10-30).
          tags=$(gh api "repos/home-assistant/core/releases?per_page=50" --jq '.[].tag_name' \
            | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$')
          tag=$(sort -V <<<"$tags" | tail -n1)
          minor=${tag%.*}
          # Before that, a minor was reviewed at its first beta (ha:last is then
          # that beta), so its stable release still gets a review of its own.
          last=$(w get ha:last)
          if due "ha:$minor" || [[ $last == "$minor".*b* ]]; then
            # A repeat (force) covers the same range as the first review.
            prev=$(w get "ha:from:$minor")
            [ -n "$prev" ] || prev=$last
            prev=${prev:-$(jq -r .homeassistant hacs.json)}
            keys+=("ha:$minor=@" "ha:from:$minor=$prev" "ha:last=$tag")
            subjects+=("Home Assistant $tag")
            cat >> "$ctx" <<CTX
          ## Home Assistant core
          - Last reviewed: $prev. New: $tag.
          - Source: https://github.com/home-assistant/core/compare/$prev...$tag
          - Frontend version each release ships: homeassistant/components/frontend/manifest.json at that tag.

          CTX
          fi

          # DBF publishes no GitHub releases, only version tags (4.38.1); each new
          # tag is reviewed. Commits between tags are not.
          tag=$(gh api "repos/derf/db-fakedisplay/tags?per_page=100" --jq '.[].name' \
            | grep -E '^[0-9]+(\.[0-9]+)+$' | sort -V | tail -n1)
          prev=$(w get dbf:last)
          if [ -z "$prev" ]; then
            w set "dbf:last=$tag" # first run: only record where we start
          else
            # Already reviewed: a repeat (force) covers the same range again.
            [ "$prev" != "$tag" ] || prev=$(w get "dbf:from:$tag")
          fi
          if [ -n "$prev" ] && due "dbf:$tag"; then
            keys+=("dbf:$tag=@" "dbf:from:$tag=$prev" "dbf:last=$tag")
            subjects+=("DBF $tag")
            cat >> "$ctx" <<CTX
          ## DBF (db-fakedisplay) server
          - Last reviewed: $prev. New: $tag.
          - Source: https://github.com/derf/db-fakedisplay/compare/$prev...$tag

          CTX
          fi

          if [ ${#keys[@]} -eq 0 ]; then
            echo "Nothing new to review."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject=$(printf '%s, ' "${subjects[@]}")
          subject=${subject%, }
          echo "Reviewing: $subject"
          {
            echo "run=true"
            echo "keys=${keys[*]}"
            echo "subject=$subject"
            echo "context<<CTX_EOF"
            echo "# Review: $subject"
            echo
            cat "$ctx"
            echo "CTX_EOF"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a cache saved after Claude's run could carry planted files
      # into later runs.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Write context
        env:
          CONTEXT: ${{ needs.detect.outputs.context }}
        run: printf '%s\n' "$CONTEXT" > "$RUNNER_TEMP/watch-context.md"

      # Claude reads untrusted upstream content, so the commands it runs are
      # kept away from the Claude token (tested 2026-10-11):
      # - the action's subprocess scrub (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB below)
      #   removes it from their environment, and bubblewrap hides every other
      #   process from them (the action installs it only for workflows open to
      #   outside users, so it is installed here);
      # - no process can read another's memory (ptrace_scope 2), and sudo is
      #   gone for the rest of the job, so nothing can read the runner's memory.
      # Docker stays available because this job needs it to build and test, and
      # Docker access amounts to root, so here a determined attack could still
      # get around the isolation.
      # What remains visible to them is the job's read-only GitHub token.
      - name: Isolate Claude's commands
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat >/dev/null
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl -qw kernel.yama.ptrace_scope=2
          sudo rm -f /etc/sudoers.d/runner
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo is still available"
            exit 1
          fi

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            Follow the instructions in .github/prompts/ha-compat.md.
            The facts for this run are in ${{ runner.temp }}/watch-context.md.
          claude_args: >-
            --model opus
            --max-turns 120
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,TodoWrite"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["clear","fixed","needs_attention","transient"]},"title":{"type":"string"},"report":{"type":"string"},"improvements":{"type":"string"}},"required":["status","title","report","improvements"]}'

      # Runs after Claude in the same job, so it ignores what Claude's commands
      # could have planted: variables written to $GITHUB_ENV (the step's own env
      # wins), directories added to PATH (absolute shell, fixed PATH) and hooks,
      # config or filters in the workspace's .git (the diff is made in a fresh
      # clone). JavaScript actions can't be shielded the same way (a planted
      # NODE_OPTIONS wins over the step's), so after Claude only the artifact
      # upload is one; code planted there still can't reach the Claude token.
      # Only the verdict and the diff leave this job. The report job, which can
      # write, turns them into a pull request or issues.
      - name: Collect result
        if: always()
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
          BASH_ENV: ""
          ENV: ""
        run: |
          export PATH=/usr/bin:/bin GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          out="$RUNNER_TEMP/watch"
          clean="$RUNNER_TEMP/watch-clean"
          mkdir -p "$out"
          printf '%s' "$VERDICT" > "$out/verdict.json"
          git clone -q --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$clean"
          git -C "$clean" -c advice.detachedHead=false checkout -q "$GITHUB_SHA"
          rsync -a --delete --exclude=/.git --exclude=/.github "$GITHUB_WORKSPACE/" "$clean/"
          # Claude's sandbox leaves empty placeholder files (.env, .npmrc,
          # package.json, lock files) where it blocks writes. A review never needs
          # to add an empty file, so new empty files are dropped.
          git -C "$clean" ls-files -z --others --exclude-standard |
            (cd "$clean" && xargs -0 -r -I{} find {} -maxdepth 0 -type f -empty -delete)
          git -C "$clean" add -A
          git -C "$clean" diff --cached --binary > "$out/changes.patch"
          git -C "$clean" diff --cached --stat

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: watch
          path: ${{ runner.temp }}/watch/
          retention-days: 1

  report:
    needs: [detect, review]
    if: always() && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 75 # includes waiting for the check on a proposed fix
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      # Pull requests opened with the Actions token start no workflows, so their
      # checks would never run. The review App's token (Contents, Issues and Pull
      # requests only) opens them instead; the Actions token is kept for
      # starting the check run on a proposed fix.
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: watch
          path: ${{ runner.temp }}/watch

      # WATCH_SECRET only lets the script refuse to publish output that contains
      # the Claude token. No code from the review runs in this job.
      - name: Open pull request / issues
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WATCH_ACTIONS_TOKEN: ${{ github.token }}
          WATCH_SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WATCH_KEYS: ${{ needs.detect.outputs.keys }}
          WATCH_SUBJECT: ${{ needs.detect.outputs.subject }}
          WATCH_BRANCH: claude/compat-${{ github.run_number }}
          WATCH_CLEAR_POLICY: strict
        run: bash .github/scripts/watch.sh report "$RUNNER_TEMP/watch"

      # Artifacts of public repositories can be downloaded by anyone signed in
      # to GitHub, so the review's raw output doesn't outlive this run.
      - name: Delete the review's files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "watch") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
